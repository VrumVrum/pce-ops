name: geo-tracker
# GEO / AI-citation tracker. Weekly: for ~36 commercial "how much does X cost /
# website cost calculator" queries, is projectcostestimator.com surfaced, and
# which competitors are? Copilot + ChatGPT web-search answer from Bing's index,
# so PCE's Bing surface is a real, keyable proxy for AI visibility.
#
# HONESTY: this repo owns no LLM key, so ChatGPT/Gemini/Claude are NOT queried
# and are reported "not_measured" — never faked, never "not cited". The measured
# engine today is Bing Webmaster Tools (BING_API_KEY). Adding BING_WEBSEARCH_KEY
# or any LLM key lights up more engines (see scripts/geo_tracker.py).
on:
  schedule:
    - cron: '40 6 * * 1'   # 06:40 UTC every Monday
  workflow_dispatch:

# Same reason as routine-heartbeat/F33: the default GITHUB_TOKEN is read-only,
# so without this the snapshot commit would 403 and land nothing.
permissions:
  contents: write

jobs:
  geo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run GEO tracker
        id: geo
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
          # Optional — present them if/when they exist; absent = engine dark.
          BING_WEBSEARCH_KEY: ${{ secrets.BING_WEBSEARCH_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # continue-on-error so the snapshot still commits on a blind run — the
        # failure is re-raised in the final step, after the commit lands.
        continue-on-error: true
        run: |
          python scripts/geo_tracker.py | tee geo.log
          echo "code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      - name: Commit snapshot
        run: |
          git config user.name  "pce-ops-bot"
          git config user.email "ops@projectcostestimator.com"
          git add data/GEO-STATE.json
          git diff --staged --quiet || git commit -m "data: geo tracker $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash -q origin master || true
          # One retry for a concurrent-push race, then FAIL LOUDLY (F33 rule).
          git push -q origin HEAD:master || {
            git pull --rebase --autostash -q origin master
            git push -q origin HEAD:master
          }

      - name: Fail loudly if the run was fully blind
        if: steps.geo.outputs.code != '0'
        run: |
          echo "::error::GEO tracker measured 0 engines — a BLIND run must never read green."
          echo "Check: is BING_API_KEY (Bing Webmaster) still valid? Any LLM key added?"
          echo "UNKNOWN is not a pass — see scripts/geo_tracker.py honesty contract."
          echo ""
          cat geo.log
          exit 1
