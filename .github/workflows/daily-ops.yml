name: daily-ops
# Runs the project's data + health jobs on GitHub's servers instead of the owner's PC.
# Public repo => Actions minutes are free and unlimited. Results are committed here and
# read by the cloud operating loop via raw.githubusercontent.com (which it CAN reach).
on:
  schedule:
    - cron: '30 4 * * *'   # 04:30 UTC daily
    - cron: '30 16 * * *'  # 16:30 UTC daily
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gsc_trends.py walks the git history of data/gsc_dump.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python deps
        run: pip install --quiet cryptography

      - name: Fetch Google Search Console data
        env:
          GSC_KEY_JSON: ${{ secrets.GSC_KEY_JSON }}
          GSC_OUT: data/gsc_dump.json
        run: |
          mkdir -p data
          python scripts/gsc_dump.py || echo "GSC step failed (non-fatal)"

      - name: Build metrics snapshot (GSC + Supabase)
        env:
          GSC_OUT: data/gsc_dump.json
          METRICS_OUT: data/METRICS.json
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
        run: python scripts/metrics.py || echo "metrics step failed (non-fatal)"

      - name: GSC trends (git-history longitudinal deltas — decay + title/meta-refit radar)
        run: python scripts/gsc_trends.py || echo "trends step failed (non-fatal)"

      - name: Pull GA4 (AI-assistant channel — the GEO bet's scoreboard)
        env:
          GSC_KEY_JSON: ${{ secrets.GSC_KEY_JSON }}
          GA4_OUT: data/GA4.json
        run: python scripts/ga4.py || echo "GA4 step failed (non-fatal)"

      - name: Bing index eyes (BWT API)
        env:
          BING_API_KEY: ${{ secrets.BING_API_KEY }}
        run: python scripts/bing.py || echo "Bing step failed (non-fatal)"

      - name: Routine scorecard (self-improvement loop eyes)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python scripts/routines_scorecard.py || echo "non-fatal"

      - name: OS lint (structural checks on the OS ledgers, ~0 false positives)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python scripts/os_lint.py || echo "non-fatal"

      - name: Due-experiment radar (verify dates that arrived)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python scripts/due_experiments.py || echo "non-fatal"

      - name: Install Playwright (functional smoke test)
        run: |
          npm init -y >/dev/null 2>&1 || true
          npm install --no-save playwright@1.49.0
          npx playwright install --with-deps chromium

      - name: Run functional smoke test against production
        env:
          SMOKE_OUT: data/SMOKE.json
        run: node scripts/smoke.cjs || echo "smoke step failed (non-fatal)"

      - name: Submit new URLs to Google + IndexNow
        env:
          GSC_KEY_JSON: ${{ secrets.GSC_KEY_JSON }}
        run: python scripts/ping_index.py || echo "index ping failed (non-fatal)"

      - name: Commit results
        run: |
          git config user.name "pce-ops-bot"
          git config user.email "ops@projectcostestimator.com"
          git add data/ || true
          git diff --staged --quiet || git commit -m "data: ops snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || echo "nothing to push"

